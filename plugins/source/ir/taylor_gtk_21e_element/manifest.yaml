# Constant across all captures (dropped): ir2 (IR2 capture method), gt
# (guitar), 44k (44.1 kHz sample rate), 2048 (IR length in samples).
# The only varying token is the processing-variant suffix
# (none / _m / _mffqn), which does not map to any real amp/pedal control
# axis, so it becomes a single 'preset' selector.
manifest_version: 1
id: ir_taylor_gtk_21e_element
display_name: GTK 21e Element
description: "Acoustic body IR of a Taylor GT K21e (Hawaiian koa), labelled \"Element\". The preset selects the full, m or mffqn IR variant."
homepage: https://www.taylorguitars.com/guitars/acoustic/gt-k21e
brand: taylor
brand_logo: assets/brand_logo.svg
type: body
backend: ir
parameters:
- name: preset
  display_name: Preset
  values:
  - full
  - m
  - mffqn
captures:
- values:
    preset: full
  file: ir/ir2_gt_44k_2048.wav
  output_gain_db: -0.0000003
- values:
    preset: m
  file: ir/ir2_gt_44k_2048_m.wav
  output_gain_db: 4.2831926
- values:
    preset: mffqn
  file: ir/ir2_gt_44k_2048_mffqn.wav
  output_gain_db: 2.5047081
