# Grab-bag of IR variants for the Taylor 714ce; names do not factor into
# real recording-control axes (sample rate / mono / ffqn processing / mic
# distance / bespoke captures), so a single clean 'preset' axis is used.
# Dropped constants: model token (714 / 714ce, already in the plugin slug).
manifest_version: 1
id: ir_taylor_714ce_2
display_name: 714ce V2
description: "Acoustic body IR of a Taylor 714ce (700 Series). The preset selects one of the 48k/44k, mono and ffqn IR renders or the ktb / kb 9in / kb 18in captures."
homepage: https://www.taylorguitars.com/guitars/acoustic/features/series/700
brand: taylor
brand_logo: assets/brand_logo.svg
type: body
backend: ir
parameters:
- name: preset
  display_name: Preset
  values:
  - 48k
  - 48k_mono
  - 48k_mono_ffqn
  - 44k_mono_ffqn
  - ktb
  - kb_9in_ffqn
  - kb_9in
  - kb_18in
captures:
- values:
    preset: 48k
  file: ir/ir_48k.wav
  output_gain_db: 5.7906399
- values:
    preset: 48k_mono
  file: ir/ir_48k_m.wav
  output_gain_db: 8.0986242
- values:
    preset: 48k_mono_ffqn
  file: ir/ir_48k_m_ffqn.wav
  output_gain_db: 7.3295641
- values:
    preset: 44k_mono_ffqn
  file: ir/ir_44k_m_ffqn.wav
  output_gain_db: 6.2748728
- values:
    preset: ktb
  file: ir/ktb714cenux.wav
  output_gain_db: 18.4295979
- values:
    preset: kb_9in_ffqn
  file: ir/kb_714_9inch_48k_mffqn.wav
  output_gain_db: 1.1008186
- values:
    preset: kb_9in
  file: ir/kb_714_9inch_48k_m.wav
  output_gain_db: 3.7921009
- values:
    preset: kb_18in
  file: ir/kb_714_18inch_48k_m.wav
  output_gain_db: 3.0973706
