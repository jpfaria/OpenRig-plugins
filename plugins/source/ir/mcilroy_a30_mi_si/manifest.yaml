# Grab-bag of IR variants of one A30 cab capture; tokens `mcilroy` and `96k`
# (sample rate) are constant across all captures and dropped. The remaining
# names mix IR tap length (8096/2048), processing flavors (bld/match/jf) and a
# separate base take (new_a), which do not factor into real control axes, so a
# single clean `preset` selector is used.
manifest_version: 1
id: ir_mcilroy_a30_mi_si
display_name: A30 Mi Si
brand: mcilroy
type: body
backend: ir
parameters:
- name: preset
  display_name: Preset
  values:
  - '8096'
  - 8096_bld
  - 8096_match
  - 8096_jf
  - '2048'
  - 2048_bld
  - 2048_match1
  - 2048_jf
  - new_a_8096
  - new_a_8096_match2
captures:
