manifest_version: 1
id: ir_taylor_114ce
display_name: 114ce
description: "Acoustic body IR of a Taylor 114ce, a grand auditorium with Venetian cutaway, torrefied spruce top, sapele back and sides and Expression System 2 electronics. Flavor selects standard, blend, match or jf."
homepage: https://www.taylorguitars.com/guitars/acoustic/114ce
brand: taylor
brand_logo: assets/brand_logo.svg
type: body
backend: ir
parameters:
- name: flavor
  display_name: Flavor
  values:
  - standard
  - blend
  - match
  - jf
captures:
- values:
    flavor: standard
  file: ir/taylor_114ce_48000.wav
  output_gain_db: 0.0000008
- values:
    flavor: blend
  file: ir/taylor_114ce_48000_bld.wav
  output_gain_db: 0.0000008
- values:
    flavor: match
  file: ir/taylor_114ce_48000_match.wav
  output_gain_db: -0.0000003
- values:
    flavor: jf
  file: ir/taylor_114ce_48000_jf_flavor.wav
  output_gain_db: 0.0000008
