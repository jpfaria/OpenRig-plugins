manifest_version: 1
id: nam_mesa_dual_rectifier_mw_red_modern_full_rig_a2
display_name: Dual Rectifier Multi-Watt Red Modern Full Rig
brand: mesa
brand_logo: assets/brand_logo.svg
output_gain_db: 3.4859047
type: amp
backend: nam
architecture: A2
sources:
- https://www.tone3000.com/tones/69206
# Full-rig captures (head + Mesa Traditional 4x12 V30 cab + SM57) of the Red channel, Modern mode.
# Dropped constants (identical across all captures): "FR" (full rig), "MBDR MW Red Mdn"
# (Mesa Boogie Dual Rectifier Multi-Watt, Red channel, Modern mode), "4FB" (the 4x12 cab),
# the SM57 mic, and Master Volume (MV-2 on every setting).
# The numbered "settings 1-6" in the source description are EQ dial combos, decomposed
# into the real tone-stack knobs (Presence/Treble/Middle/Bass):
#   1 - P-2 T-5 M-4 B-2
#   2 - P-3 T-6 M-4 B-3
#   3 - P-3 T-6 M-6 B-3
#   4 - P-4 T-4 M-3 B-4
#   5 - P-5 T-4 M-5 B-3
#   6 - P-6 T-0 M-7 B-3
# Boosted captures exist only for setting 1 and mic position a. Boost pedals:
#   TDLX = Wampler Tumnus Deluxe, SD1 = Boss SD-1, OD808 = Maxon OD808,
#   TMB-66 / TMB-73 = Keeley Time Machine Boost 1966 / 1973 modes.
# Speaker (cab speaker the SM57 was on): LL lower left, LR lower right, UL upper left, UR upper right.
# Position (SM57): on_grille = a (0.50" from cap center, on the grille);
#   off_grille = b (0.75" from cap center, 0.50" off the grille).
parameters:
- name: boost
  display_name: Boost
  values:
  - none
  - tumnus_deluxe
  - sd1
  - od808
  - tmb_66
  - tmb_73
- name: presence
  display_name: Presence
  values:
  - 2
  - 3
  - 4
  - 5
  - 6
- name: treble
  display_name: Treble
  values:
  - 0
  - 4
  - 5
  - 6
- name: middle
  display_name: Middle
  values:
  - 3
  - 4
  - 5
  - 6
  - 7
- name: bass
  display_name: Bass
  values:
  - 2
  - 3
  - 4
- name: speaker
  display_name: Speaker
  values:
  - ll
  - lr
  - ul
  - ur
- name: position
  display_name: Position
  values:
  - on_grille
  - off_grille
captures:
