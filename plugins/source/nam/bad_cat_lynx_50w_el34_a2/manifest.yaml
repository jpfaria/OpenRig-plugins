manifest_version: 1
id: nam_bad_cat_lynx_50w_el34_a2
display_name: Lynx 50W EL34
brand: bad_cat
output_gain_db: -0.7955626
type: amp
backend: nam
architecture: A2
sources:
- https://www.tone3000.com/tones/30122
# Only the full-amp "[AMP] ... - DI" A2 profiles of tone 30122 are imported.
# Dropped constant tokens: "[AMP]", "Lynx50", "DI" (A2 DI reamp).
# Legend (from the tone3000 description):
#   load     CL = cabinet: amp loaded by a real Mesa 4x12 Oversized Straight cab
#            RL = reactive: amp loaded by a St.Rock React:IR2 reactive load box
#   channel  Ch1 / Ch2 of the Lynx 50W
#   input    Hi / Lo input jack
#   preset   the author's named setting; knob positions are only published in an
#            external guide, not in the description, so they stay a preset axis.
#            "(use with TS)" (RL naming) and "for TS" (CL naming) name the same
#            setting and share one preset value (e.g. olala_for_ts_1).
# Skipped: [PRE] preamp-only and [POW] poweramp-only profiles (not a full amp),
# the [FRC] load-matching profile, and every A1 "- STD" row.
