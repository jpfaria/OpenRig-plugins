# Marshall JTM 45 Reissue (2x5881, GZ34 rectifier) by slamminmofo, tone3000 #33505
# ("Hyper Accuracy+"). Only architecture_version 2 models are shipped.
#
# Capture-name legend (SLAMMIN_MARSHALL_J45_V<n>[BOTH]_<WORD>_P<n>_<size>):
#   V<n>   -> volume: treble-channel Volume I setting (VN<n> = normal-channel
#             volume, input: normal). BOTH -> input: jumpered (channels
#             jumpered); otherwise the bright hi-sensitivity input (treble).
#   <WORD> -> preset: the author's EQ-setting description word (balanced,
#             bright, cranked, fat, lo_cut, mids, scoop, warm, beano, beano_v2,
#             beano_fat, cleanish, malcolmish, min_bass_max_mid_treble).
#             TREBLEBOOSTER / SMOOTHDRVE / MORESMOOTHDRVE / SMOOTHERDRVE are
#             pedals in front of the amp (per the description) -> boost axis;
#             those captures name no EQ setting -> preset: default.
#   P<n>   -> presence.
# Dropped constant tokens: SLAMMIN, MARSHALL, J45. The size suffix (S / XS / C =
# NAM Standard / xStandard / Complex training) is training metadata, not a
# control: one capture per setting, preferring XS, else S, else C. Only
# V3_BRIGHT_P8 had two sizes (S and C); S was kept.
manifest_version: 1
id: nam_marshall_jtm45_hyper_accuracy_a2
display_name: JTM 45 Hyper Accuracy
brand: marshall
brand_logo: assets/brand_logo.svg
output_gain_db: 0.0000000
type: amp
backend: nam
architecture: A2
sources:
- https://www.tone3000.com/tones/33505
