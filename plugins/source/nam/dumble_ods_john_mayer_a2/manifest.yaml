manifest_version: 1
id: nam_dumble_ods_john_mayer_a2
display_name: Dumble ODS — John Mayer
author: "1945330"
description: "Neural captures of a Dumble ODS amp dialed for a John Mayer tone, in normal and hiz variants."
brand: dumble
license: T3K
homepage: https://www.tone3000.com/tones/65812
sources:
- https://www.tone3000.com/tones/65812
output_gain_db: 8.4574547
type: amp
backend: nam
architecture: A2
# tone3000 names: "nam" (normal input) / "nam hiz" (high-impedance input). Only the input mode varies.
parameters:
- name: character
  display_name: Character
  values:
  - normal
  - hiz
captures:
- values:
    character: normal
  file: captures/normal.nam
- values:
    character: hiz
  file: captures/hiz.nam
