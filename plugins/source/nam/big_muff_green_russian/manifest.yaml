manifest_version: 1
id: nam_big_muff_green_russian
display_name: Big Muff Green Russian Clone
author: "kosmicaudio"
description: "Neural capture of a Green Russian Big Muff clone (flat mids) across a grid of distortion (9 o'clock to max) and tone (10:30 to 1:30) settings, with volume at about 3 o'clock."
brand: electro_harmonix
license: T3K
homepage: https://www.tone3000.com/tones/66686
sources:
- https://www.tone3000.com/tones/66686
